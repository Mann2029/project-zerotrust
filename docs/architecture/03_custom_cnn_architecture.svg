<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <linearGradient id="grad-purple3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4C1D95" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg3)"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <rect width="1480" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow3)"/>
    <text x="30" y="48" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">Custom IR-ResNet-50 Multi-Modular CNN Architecture</text>
    <text x="1110" y="48" font-family="Segoe UI, monospace" font-size="14" fill="#A78BFA">25-EPOCH TRAINED CHECKPOINT</text>
    <text x="30" y="68" font-family="Segoe UI, sans-serif" font-size="13" fill="#94A3B8">Inception-ResNet Deep Backbone • Multi-Task Decoupled Dual Heads (512-D Identity & Anti-Spoof Liveness)</text>
  </g>

  <!-- STAGE 1: INPUT & STEM -->
  <g transform="translate(60, 150)">
    <rect width="320" height="780" rx="16" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="320" height="45" rx="16" fill="#0284C7"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">1. Preprocessing & Stem</text>

    <g transform="translate(15, 65)">
      <rect width="290" height="120" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">Input Tensor</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Shape: (None, 112, 112, 3)</text>
      <text x="12" y="64" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Aligned Face Crop (RGB)</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="11" fill="#94A3B8">Range: [-1.0, 1.0]</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">Formula: (pixel / 127.5) - 1.0</text>
    </g>

    <g transform="translate(15, 205)">
      <rect width="290" height="140" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">Stem Layer Block</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Conv2D (3x3, filters=64)</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Stride = 1, padding='same'</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">BatchNormalization()</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">PReLU(shared_axes=[1, 2])</text>
      <text x="12" y="124" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Output: (112, 112, 64)</text>
    </g>

    <g transform="translate(15, 365)">
      <rect width="290" height="140" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">Test-Time Augmentation (TTA)</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Dual Inference at Runtime:</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">1. Original Crop: (112, 112, 3)</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">2. Horiz-Flipped: (112, 112, 3)</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">v_final = norm(v_orig + v_flip)</text>
      <text x="12" y="124" font-family="Segoe UI, sans-serif" font-size="10" fill="#E2E8F0">+1.5% Cosine Precision Boost</text>
    </g>
  </g>

  <!-- STAGE 2: DEEP INCEPTION-RESNET BACKBONE -->
  <g transform="translate(410, 150)">
    <rect width="450" height="780" rx="16" fill="#0F172A" stroke="#818CF8" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="450" height="45" rx="16" fill="#4338CA"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2. 4-Stage Inception-ResNet Backbone (23.5M Params)</text>

    <g transform="translate(15, 65)">
      <rect width="420" height="110" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Stage 1: 3x Inception-ResNet-A Blocks</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Multi-scale feature extraction: 1x1, 3x3, and 5x5 receptive fields</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Filters: 64 • Residual addition shortcut: x = x + F(x)</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">Reduction 1: Strided Conv 3x3 (stride=2) -> (56, 56, 128)</text>
    </g>

    <g transform="translate(15, 190)">
      <rect width="420" height="110" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Stage 2: 4x Inception-ResNet-B Blocks</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Intermediate facial contour & landmark geometry mapping</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Filters: 128 • Linear bottleneck projections</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">Reduction 2: Strided Conv 3x3 (stride=2) -> (28, 28, 256)</text>
    </g>

    <g transform="translate(15, 315)">
      <rect width="420" height="110" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Stage 3: 6x Inception-ResNet-C Blocks</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">High-level identity representations & fine texture encoding</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Filters: 256 • Residual scale factor = 0.2</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">Reduction 3: Strided Conv 3x3 (stride=2) -> (14, 14, 512)</text>
    </g>

    <g transform="translate(15, 440)">
      <rect width="420" height="110" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Stage 4: 3x Inception-ResNet-D Blocks</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Discriminative identity embedding features</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Filters: 512 • BatchNormalization & PReLU</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">Output: (7, 7, 512) Feature Volume</text>
    </g>

    <g transform="translate(15, 565)">
      <rect width="420" height="90" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#A5B4FC">Global Average Pooling & Bottleneck</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">GAP2D: (None, 7, 7, 512) -> (None, 512)</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#F59E0B">Dropout(0.4) -> Feeds Dual Task Heads</text>
    </g>
  </g>

  <!-- STAGE 3: MULTI-TASK DECOUPLED DUAL HEADS -->
  <g transform="translate(890, 150)">
    <rect width="360" height="780" rx="16" fill="#0F172A" stroke="#7C3AED" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="360" height="45" rx="16" fill="url(#grad-purple3)"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3. Decoupled Dual Output Heads</text>

    <!-- Head A -->
    <g transform="translate(15, 65)">
      <rect width="330" height="240" rx="8" fill="#1E293B" stroke="#8B5CF6"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#C4B5FD">MODULE A: Biometric Identity Head</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Dense(512, use_bias=False)</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">BatchNormalization()</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="11" fill="#38BDF8">Lambda: L2 Hypersphere Normalization</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">v = x / sqrt(sum(x^2))</text>
      <text x="12" y="124" font-family="Segoe UI, monospace" font-size="11" fill="#F59E0B">Layer Name: "identity_out"</text>
      <text x="12" y="144" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Output: 512-D Vector on Unit Sphere</text>
      <text x="12" y="164" font-family="Segoe UI, sans-serif" font-size="11" fill="#A7F3D0">Training Loss: ArcFace Margin (m=0.5, s=64)</text>
      <text x="12" y="184" font-family="Segoe UI, sans-serif" font-size="11" fill="#94A3B8">Cosine Angular Separation on Hypersphere</text>
      <text x="12" y="204" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">Achieved Sim: Genuine 0.8412 | Impostor 0.1834</text>
      <text x="12" y="222" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">Separation Margin: 0.6578</text>
    </g>

    <!-- Head B -->
    <g transform="translate(15, 320)">
      <rect width="330" height="210" rx="8" fill="#1E293B" stroke="#F59E0B"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#FDE68A">MODULE B: Auxiliary Anti-Spoof Head</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Dense(128, activation='relu')</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="11" fill="#E2E8F0">Dropout(0.4)</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="11" fill="#F59E0B">Dense(1, activation='sigmoid')</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="11" fill="#F59E0B">Layer Name: "liveness_out"</text>
      <text x="12" y="124" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Output: Liveness Probability [0.0 - 1.0]</text>
      <text x="12" y="144" font-family="Segoe UI, sans-serif" font-size="11" fill="#10B981">Binary Cross-Entropy Loss</text>
      <text x="12" y="164" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">Accuracy: 100.0% on CASIA-SURF validation</text>
      <text x="12" y="184" font-family="Segoe UI, sans-serif" font-size="10" fill="#E2E8F0">Detects 2D print attacks, replay screens</text>
    </g>

    <!-- Deployment Checkpoint -->
    <g transform="translate(15, 545)">
      <rect width="330" height="110" rx="8" fill="#1E293B" stroke="#10B981"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34D399">Trained Weights on Disk</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">custom_ir_resnet50_v1.h5 (449.2 MB)</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">custom_ir_resnet50_best.h5 (449.2 MB)</text>
      <text x="12" y="84" font-family="Segoe UI, sans-serif" font-size="10" fill="#94A3B8">Trained on NVIDIA RTX 4050 GPU (13.72 min)</text>
    </g>
  </g>

  <!-- STAGE 4: PRODUCTION VERIFICATION ENGINE -->
  <g transform="translate(1280, 150)">
    <rect width="260" height="780" rx="16" fill="#0F172A" stroke="#10B981" stroke-width="1.5" filter="url(#shadow3)"/>
    <rect x="0" y="0" width="260" height="45" rx="16" fill="#065F46"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">4. Runtime SNN Engine</text>

    <g transform="translate(15, 65)">
      <rect width="230" height="150" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="10" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#34D399">SiameseMatcher in RAM</text>
      <text x="10" y="42" font-family="Segoe UI, monospace" font-size="10" fill="#E2E8F0">Preloaded Identity Matrix:</text>
      <text x="10" y="60" font-family="Segoe UI, monospace" font-size="10" fill="#38BDF8">V_reg: Shape (15, 512)</text>
      <text x="10" y="78" font-family="Segoe UI, monospace" font-size="10" fill="#E2E8F0">1-to-N Inner Product:</text>
      <text x="10" y="96" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">S = dot(V_reg, v_live)</text>
      <text x="10" y="114" font-family="Segoe UI, monospace" font-size="10" fill="#E2E8F0">Search Latency: 4.45 ms</text>
      <text x="10" y="132" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">RAM Boot: 4.23 ms</text>
    </g>

    <g transform="translate(15, 230)">
      <rect width="230" height="150" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="10" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#F59E0B">Decision Boundaries</text>
      <text x="10" y="42" font-family="Segoe UI, sans-serif" font-size="10" fill="#10B981">• Sim >= 0.65:</text>
      <text x="10" y="58" font-family="Segoe UI, sans-serif" font-size="10" fill="#FFFFFF">  INSTANT AUTO-APPROVE</text>
      <text x="10" y="78" font-family="Segoe UI, sans-serif" font-size="10" fill="#F59E0B">• 0.48 <= Sim < 0.65:</text>
      <text x="10" y="94" font-family="Segoe UI, sans-serif" font-size="10" fill="#FFFFFF">  DUAL REVIEW QUEUE</text>
      <text x="10" y="114" font-family="Segoe UI, sans-serif" font-size="10" fill="#EF4444">• Sim < 0.48:</text>
      <text x="10" y="130" font-family="Segoe UI, sans-serif" font-size="10" fill="#FFFFFF">  REJECT / UNKNOWN</text>
    </g>

    <g transform="translate(15, 395)">
      <rect width="230" height="200" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="10" y="22" font-family="Segoe UI, sans-serif" font-size="12" font-weight="700" fill="#38BDF8">Notebook Execution</text>
      <text x="10" y="42" font-family="Segoe UI, monospace" font-size="9" fill="#E2E8F0">multimodal_custom_cnn.ipynb</text>
      <text x="10" y="60" font-family="Segoe UI, monospace" font-size="9" fill="#94A3B8">• Cell 16: 25 Epoch Logs</text>
      <text x="10" y="78" font-family="Segoe UI, monospace" font-size="9" fill="#94A3B8">• Cell 22: Metrics Table</text>
      <text x="10" y="96" font-family="Segoe UI, monospace" font-size="9" fill="#94A3B8">• Cell 24: 4-Panel Plots</text>
      <text x="10" y="114" font-family="Segoe UI, monospace" font-size="9" fill="#94A3B8">• Cell 26: Confusion Matrix</text>
      <text x="10" y="136" font-family="Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#10B981">Final Metrics (Epoch 25):</text>
      <text x="10" y="154" font-family="Segoe UI, monospace" font-size="9" fill="#FFFFFF">Train Loss: 8.9672</text>
      <text x="10" y="170" font-family="Segoe UI, monospace" font-size="9" fill="#FFFFFF">Val Loss: 8.9222</text>
      <text x="10" y="186" font-family="Segoe UI, monospace" font-size="9" fill="#10B981">Liveness Acc: 100.0%</text>
    </g>
  </g>
</svg>