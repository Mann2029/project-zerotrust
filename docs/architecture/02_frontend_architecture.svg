  <rect width="1600" height="1000" fill="url(#bg2)"/>

  <!-- Title -->
  <g transform="translate(60, 40)">
    <rect width="1480" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow2)"/>
    <text x="30" y="48" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">AuraTrust Frontend Architecture & Component Hierarchy</text>
    <text x="1140" y="48" font-family="Segoe UI, monospace" font-size="14" fill="#38BDF8">REACT 19 + VITE + TAILWIND</text>
    <text x="30" y="68" font-family="Segoe UI, sans-serif" font-size="13" fill="#94A3B8">Three.js WebGL Interactive Background • Resilient WebSockets • Role-Based Navigation</text>
  </g>

  <!-- COLUMN 1: ENTRY & SHELL -->
