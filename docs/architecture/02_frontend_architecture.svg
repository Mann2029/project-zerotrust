    <rect x="0" y="0" width="400" height="45" rx="16" fill="#4338CA"/>
    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">2. Core View Modules</text>

    <g transform="translate(15, 65)">
