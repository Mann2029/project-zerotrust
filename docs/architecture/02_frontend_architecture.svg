    <text x="15" y="28" font-family="Segoe UI, sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">3. Network & Transport Abstraction</text>

    <g transform="translate(15, 65)">
      <rect width="370" height="230" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34D399">services/api.js (REST Client)</text>
      <text x="12" y="44" font-family="Segoe UI, monospace" font-size="10" fill="#E2E8F0">Bearer Token Automatic Injection</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• login(user, pass) -> localStorage token</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• logout() -> token purge & cookie clear</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• getActiveSessions() -> /sessions/active</text>
      <text x="12" y="124" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• getStagedAttendance(id) -> /staging/{id}</text>
      <text x="12" y="144" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• commitAttendance(id) -> /commit/{id}</text>
      <text x="12" y="164" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• queryCopilot(query) -> /xai/query-copilot</text>
      <text x="12" y="184" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• getStudentDashboard() -> /student/dashboard</text>
      <text x="12" y="204" font-family="Segoe UI, monospace" font-size="10" fill="#10B981">Automatic 401 Interception -> Session Logout</text>
    </g>

    <g transform="translate(15, 310)">
      <rect width="370" height="210" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34D399">services/websocket.js (WS Client)</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Resilient WebSocket Connection Hub</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• Exponential Backoff Auto-Reconnect</text>
      <text x="12" y="84" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">  (Base 1s, Max 10s, Multiplier 1.5x)</text>
      <text x="12" y="104" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• Query Token Param Authentication</text>
      <text x="12" y="124" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• Heartbeat Keepalive (25s Ping Interval)</text>
      <text x="12" y="144" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• Channel Subscriptions (session_1, etc.)</text>
      <text x="12" y="164" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">• Observer Listener Registry (Set)</text>
      <text x="12" y="184" font-family="Segoe UI, sans-serif" font-size="11" fill="#10B981">Dev Port Fallback (5173 -> 8000 Proxy)</text>
    </g>

    <g transform="translate(15, 535)">
      <rect width="370" height="140" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#34D399">Design System & Styling</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Typography: Segoe UI / Inter System Stack</text>
      <text x="12" y="64" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Color Palette: Deep Slate (#070B19, #0F172A)</text>
      <text x="12" y="84" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Accents: Cyan (#38BDF8), Emerald (#10B981)</text>
      <text x="12" y="104" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Icons: Lucide React (Shield, Camera, Users)</text>
    </g>
