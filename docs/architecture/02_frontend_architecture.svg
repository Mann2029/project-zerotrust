      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">PortalTransitionOverlay.jsx</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Zero-Flicker View Transitions</text>
      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">1250ms Smooth Kinetic Blur</text>
    </g>
