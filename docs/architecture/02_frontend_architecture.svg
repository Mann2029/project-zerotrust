      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">AppShell.jsx (Layout Engine)</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Responsive Navigation Sidebar</text>
      <text x="12" y="64" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">WS Health Pill & Active Session Pill</text>
      <text x="12" y="84" font-family="Segoe UI, sans-serif" font-size="11" fill="#F59E0B">Role-Gated Navigation Links</text>
