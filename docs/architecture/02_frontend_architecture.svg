      <text x="12" y="64" font-family="Segoe UI, monospace" font-size="10" fill="#94A3B8">Tailwind v3.4 Utility Design Tokens</text>
    </g>

    <g transform="translate(15, 165)">
      <rect width="310" height="110" rx="8" fill="#1E293B" stroke="#475569"/>
      <text x="12" y="24" font-family="Segoe UI, sans-serif" font-size="13" font-weight="700" fill="#38BDF8">App.jsx (Core Orchestrator)</text>
      <text x="12" y="44" font-family="Segoe UI, sans-serif" font-size="11" fill="#E2E8F0">Hash Routing (#landing, #faculty, etc.)</text>
