<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#070B19" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <g transform="translate(60, 40)">
    <rect width="1480" height="80" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="30" y="48" font-family="Segoe UI, sans-serif" font-size="28" font-weight="700" fill="#F8FAFC">AuraTrust Multi-Modal AI & Machine Learning Pipeline</text>
    <text x="30" y="68" font-family="Segoe UI, sans-serif" font-size="13" fill="#38BDF8">Vision Processing ➔ Neural Embeddings ➔ Metric Matching ➔ Anomaly Risk Gate</text>
  </g>
  
        <g transform="translate(60, 160)">
          <rect width="1480" height="760" rx="16" fill="#0F172A" stroke="#8B5CF6" stroke-width="2"/>
          <g transform="translate(40, 40)">
            <rect x="0" y="0" width="440" height="300" rx="12" fill="#1E293B" stroke="#334155"/>
            <text x="20" y="35" font-family="Segoe UI" font-size="16" font-weight="700" fill="#38BDF8">1. PERCEPTION & ALIGNMENT</text>
            <text x="20" y="70" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• OpenCV Face Detection with 15% Padding</text>
            <text x="20" y="105" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• 5-Point Landmark Canonical Alignment</text>
            <text x="20" y="140" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• SolvePnP 3D Head Pose (Pitch, Yaw, Roll)</text>
            <text x="20" y="175" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Rescaled to 112x112x3 Float32 [-1, 1]</text>

            <rect x="500" y="0" width="440" height="300" rx="12" fill="#1E293B" stroke="#334155"/>
            <text x="520" y="35" font-family="Segoe UI" font-size="16" font-weight="700" fill="#818CF8">2. CUSTOM IR-RESNET-50</text>
            <text x="520" y="70" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• 4-Stage Inception-ResNet Backbone (23.5M params)</text>
            <text x="520" y="105" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Module A: 512-D L2 Hypersphere (identity_out)</text>
            <text x="520" y="140" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Module B: Dense 128 + Sigmoid (liveness_out)</text>
            <text x="520" y="175" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• ArcFace Angular Margin Loss (m=0.5, s=64)</text>

            <rect x="1000" y="0" width="440" height="300" rx="12" fill="#1E293B" stroke="#334155"/>
            <text x="1020" y="35" font-family="Segoe UI" font-size="16" font-weight="700" fill="#10B981">3. SNN RAM MATCHER</text>
            <text x="1020" y="70" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• 15 Enrolled Identities preloaded in RAM (4.23ms)</text>
            <text x="1020" y="105" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Vectorized Cosine Inner Product: S = V . v</text>
            <text x="1020" y="140" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Search Latency: 1.58 ms to 4.45 ms</text>
            <text x="1020" y="175" font-family="Segoe UI" font-size="13" fill="#E2E8F0">• Separation Margin: 0.6578 (Genuine vs Impostor)</text>

            <rect x="0" y="350" width="1440" height="250" rx="12" fill="#1E293B" stroke="#F59E0B"/>
            <text x="20" y="385" font-family="Segoe UI" font-size="16" font-weight="700" fill="#F59E0B">4. ZERO-TRUST DYNAMIC RISK BROKER & DECISION BOUNDARIES</text>
            <text x="20" y="425" font-family="Consolas" font-size="15" fill="#F8FAFC">R(t) = 35%*(1 - Liveness) + 35%*(1 - SNN_Match) + 15%*IsoForest + 15%*HabitDecay</text>
            <text x="20" y="470" font-family="Segoe UI" font-size="13" fill="#10B981">• Risk &lt; 30 ➔ INSTANT AUTO-APPROVE (Inserts into attendance_staging buffer)</text>
            <text x="20" y="505" font-family="Segoe UI" font-size="13" fill="#F59E0B">• 30 &lt;= Risk &lt; 70 ➔ FLAGGED (Enqueued into Dual-Verification Queue for Faculty Review)</text>
            <text x="20" y="540" font-family="Segoe UI" font-size="13" fill="#EF4444">• Risk &gt;= 70 ➔ SECURITY BLOCK (Access denied, logged to anomaly_events with forensic explanation)</text>
          </g>
        </g>
        
</svg>